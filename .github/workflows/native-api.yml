name: Native Manim API regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/studio/**', 'server/**', 'scripts/**', 'package*.json', '.github/workflows/native-api.yml']
  pull_request:
    paths: ['src/studio/**', 'server/**', 'scripts/**', 'package*.json', '.github/workflows/native-api.yml']

permissions:
  contents: read

concurrency:
  group: native-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cairo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Initialize installation diagnostics
        id: diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/ci
          { date -u; python --version; node --version; npm --version; df -h /; } | tee artifacts/ci/environment.log
      - name: Install Cairo, OpenGL and TeX system packages
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee artifacts/ci/apt-update.log
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config ffmpeg xvfb xauth libgl1-mesa-dri libegl1 mesa-utils fonts-noto-cjk texlive-latex-extra texlive-fonts-recommended dvisvgm 2>&1 | tee artifacts/ci/apt-install.log
      - name: Install pinned Manim runtime
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check --no-input --timeout 60 --retries 3 --progress-bar off -r scripts/requirements-ci.txt 2>&1 | tee artifacts/ci/pip-install.log
      - name: Install application dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/ci/npm-install.log
      - name: Check dependency advisories
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/api
          npm audit --json | tee artifacts/api/dependency-audit.json
      - name: Validate native evidence handling
        run: python scripts/test_verify_api_registry.py
      - name: Run actual Manim behavior and differential tests
        env:
          ANYVIS_API_REPORT: artifacts/api/native-evidence.json
          ANYVIS_API_FAMILIES_REPORT: artifacts/api/native-families-evidence.json
          ANYVIS_API_QUERIES_REPORT: artifacts/api/native-queries-evidence.json
          ANYVIS_API_UTILITIES_REPORT: artifacts/api/native-utilities-evidence.json
          ANYVIS_API_MUTATIONS_REPORT: artifacts/api/native-mutations-evidence.json
          ANYVIS_API_CONFIG_REPORT: artifacts/api/native-config-evidence.json
          ANYVIS_API_RASTER_REPORT: artifacts/api/native-raster-evidence.json
          ANYVIS_API_ANIMATION_STATE_REPORT: artifacts/api/native-animation-state-evidence.json
          ANYVIS_API_POINTCLOUD_REPORT: artifacts/api/native-pointcloud-evidence.json
          ANYVIS_API_SCENE_REPORT: artifacts/api/native-scene-evidence.json
          ANYVIS_API_COORDINATES_REPORT: artifacts/api/native-coordinates-evidence.json
          ANYVIS_API_OPENGL_STATE_REPORT: artifacts/api/native-opengl-state-evidence.json
        run: |
          export ANYVIS_PYTHON="$(command -v python)"
          npm run test:api-native
          xvfb-run -a python scripts/verify-api-registry.py --native-report artifacts/api/native-evidence.json --native-report artifacts/api/native-families-evidence.json --native-report artifacts/api/native-queries-evidence.json --native-report artifacts/api/native-utilities-evidence.json --native-report artifacts/api/native-mutations-evidence.json --native-report artifacts/api/native-config-evidence.json --native-report artifacts/api/native-raster-evidence.json --native-report artifacts/api/native-animation-state-evidence.json --native-report artifacts/api/native-pointcloud-evidence.json --native-report artifacts/api/native-scene-evidence.json --native-report artifacts/api/native-coordinates-evidence.json --native-report artifacts/api/native-opengl-state-evidence.json --output artifacts/api/native-coverage.json
      - name: Verify editor and workbench semantics in Manim
        env:
          ANYVIS_REQUIRE_MANIM: "1"
        run: |
          export ANYVIS_PYTHON="$(command -v python)"
          node --test scripts/api-evidence.spec-node.mjs
          node --test src/studio/core/editor-semantics.native.spec-node.mjs
          node --test src/studio/core/workbench-semantics.native.spec-node.mjs
          node --test src/studio/playground.native.spec-node.mjs
      - name: Verify actual OpenGL pixels with Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # LLVMpipe on this runner crashes inside VAO.render; use Mesa's
          # non-JIT software driver and retain the same strict pixel assertions.
          GALLIUM_DRIVER: softpipe
          ANYVIS_REQUIRE_OPENGL: "1"
        run: |
          export ANYVIS_PYTHON="$(command -v python)"
          xvfb-run -a npm run test:opengl-render
      - name: Run actual worker media integration
        run: |
          export ANYVIS_PYTHON="$(command -v python)"
          npm run test:render
          npm run test:media
          npm run test:music
      - name: Upload native evidence and installation diagnostics
        if: always() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AnyVis-native-cairo-${{ github.sha }}
          path: |
            artifacts/api/*.json
            artifacts/ci/*.log
          if-no-files-found: error
          retention-days: 14
